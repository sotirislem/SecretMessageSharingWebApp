<div class="modal-header">
	<h5 id="modal-basic-title" class="modal-title">
		{{data.title}}
	</h5>
</div>

<div class="modal-body">
	<ng-container [ngTemplateOutlet]="data.bodyTemplateRef"></ng-container>

	<div class="modal-actions">
		<button type="button" class="btn btn-primary flex-fill" (click)="resultOk()">Confirm</button>
		<button type="button" class="btn btn-outline-secondary flex-fill" (click)="resultCancel()">Cancel</button>
	</div>
</div>
