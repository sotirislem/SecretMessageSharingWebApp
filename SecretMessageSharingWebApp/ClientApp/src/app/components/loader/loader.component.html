@if (loaderService.loading()) {
	<div class="loader-wrapper">
		<div class="spinner-wrapper text-center">
			<div class="spinner-border text-primary" role="status">
				<span class="visually-hidden">LOADING</span>
			</div>
			<div class="spinner-text">
				Please wait...
			</div>
		</div>
	</div>
}
